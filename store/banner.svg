<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2552"/>
      <stop offset="55%" stop-color="#1B5EBF"/>
      <stop offset="100%" stop-color="#14448E"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E95420"/>
      <stop offset="100%" stop-color="#FF7A33"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#226CE0"/>
      <stop offset="100%" stop-color="#0E3675"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Fundo principal -->
  <rect width="1200" height="600" rx="24" fill="url(#bannerBg)"/>

  <!-- Elementos decorativos de fundo (estilo Lomiri / Suru) -->
  <circle cx="1080" cy="90" r="240" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="960" cy="540" r="280" fill="#E95420" opacity="0.10"/>
  <path d="M 0 520 Q 380 460 760 540 T 1200 490 L 1200 600 L 0 600 Z" fill="#081C3E" opacity="0.45"/>

  <!-- Ícone Joplin UT à esquerda -->
  <g transform="translate(80, 130)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="180" height="180" rx="38" fill="url(#iconBg)" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2"/>
    <path d="M 38 22 L 46 22 C 49 22 51 24 51 27 L 51 153 C 51 156 49 158 46 158 L 38 158 C 31 158 26 153 26 146 L 26 34 C 26 27 31 22 38 22 Z" fill="url(#orangeAccent)"/>
    <path d="M 104 44 L 132 44 L 132 114 C 132 131 126 143 114 150 C 102 158 86 160 68 155 L 72 133 C 83 135 92 134 99 129 C 106 124 109 115 109 104 L 109 44 Z" fill="#FFFFFF"/>
    <circle cx="77" cy="51" r="9.5" fill="#FFFFFF"/>
  </g>

  <!-- Título e subtítulo -->
  <text x="80" y="375" font-family="Ubuntu, DejaVu Sans, sans-serif" font-size="68" font-weight="bold" fill="#FFFFFF">Joplin UT</text>
  <rect x="80" y="396" width="110" height="6" rx="3" fill="url(#orangeAccent)"/>

  <text x="80" y="446" font-family="Ubuntu, DejaVu Sans, sans-serif" font-size="26" fill="#DCE8FF">
    Cliente nativo Joplin &amp; Nextcloud WebDAV para Ubuntu Touch
  </text>

  <!-- Selos de recursos -->
  <g transform="translate(80, 482)">
    <rect x="0" y="0" width="176" height="44" rx="22" fill="#FFFFFF" opacity="0.14"/>
    <text x="88" y="28" text-anchor="middle" font-family="Ubuntu, DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Markdown Rico</text>

    <rect x="192" y="0" width="166" height="44" rx="22" fill="#FFFFFF" opacity="0.14"/>
    <text x="275" y="28" text-anchor="middle" font-family="Ubuntu, DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Offline-First</text>

    <rect x="374" y="0" width="196" height="44" rx="22" fill="#E95420" opacity="0.92"/>
    <text x="472" y="28" text-anchor="middle" font-family="Ubuntu, DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Checklists &amp; Sync</text>
  </g>

  <!-- Ilustração do Card de Nota / Checklist à direita -->
  <g transform="translate(750, 76)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="370" height="448" rx="26" fill="#FFFFFF"/>
    <!-- Barra superior do card -->
    <rect x="0" y="0" width="370" height="64" rx="26" fill="#F4F6FA"/>
    <rect x="0" y="38" width="370" height="26" fill="#F4F6FA"/>
    <circle cx="34" cy="32" r="8" fill="#E95420"/>
    <text x="54" y="39" font-family="Ubuntu, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#1B5EBF">Cadernos &amp; Notas</text>

    <!-- Linhas de checklist simuladas -->
    <g transform="translate(28, 96)">
      <rect x="0" y="0" width="26" height="26" rx="6" fill="#E95420"/>
      <path d="M 6 13 L 11 18 L 20 8" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="42" y="6" width="220" height="14" rx="7" fill="#2C3E50"/>

      <rect x="0" y="50" width="26" height="26" rx="6" fill="#E95420"/>
      <path d="M 6 13 L 11 18 L 20 8" transform="translate(0, 50)" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="42" y="56" width="180" height="14" rx="7" fill="#2C3E50"/>

      <!-- Subitem indentado -->
      <rect x="34" y="100" width="24" height="24" rx="6" fill="none" stroke="#1B5EBF" stroke-width="3"/>
      <rect x="74" y="106" width="190" height="12" rx="6" fill="#5D6D7E"/>

      <rect x="34" y="146" width="24" height="24" rx="6" fill="none" stroke="#1B5EBF" stroke-width="3"/>
      <rect x="74" y="152" width="150" height="12" rx="6" fill="#5D6D7E"/>

      <!-- Separador -->
      <line x1="0" y1="200" x2="314" y2="200" stroke="#E5E8EC" stroke-width="2"/>

      <!-- Bloco de texto Markdown -->
      <rect x="0" y="224" width="140" height="16" rx="8" fill="#1B5EBF"/>
      <rect x="0" y="256" width="290" height="10" rx="5" fill="#95A5A6"/>
      <rect x="0" y="278" width="260" height="10" rx="5" fill="#95A5A6"/>
      <rect x="0" y="300" width="210" height="10" rx="5" fill="#95A5A6"/>
    </g>
  </g>
</svg>
